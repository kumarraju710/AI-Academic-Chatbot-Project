{% extends "base_admin.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Admin Dashboard</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-header">Total Students</div>
                <div class="card-body">
                    <h5 class="card-title">{{ total_students }}</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-header">Total Admins</div>
                <div class="card-body">
                    <h5 class="card-title">{{ total_admins }}</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-header">Total Chat Logs</div>
                <div class="card-body">
                    <h5 class="card-title">{{ total_chat_logs }}</h5>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-6">
            <a href="{% url 'user_management' %}" class="btn btn-secondary btn-lg">User Management</a>
        </div>
        <div class="col-md-6">
            <a href="{% url 'analytics' %}" class="btn btn-secondary btn-lg">Analytics</a>
        </div>
    </div>
</div>

{% endblock %}
