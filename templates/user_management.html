{% extends "base_admin.html" %}
{% block content %}

<div class="container mt-4">
    <h2>User Management</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Date Joined</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
                <td>{{ user.date_joined }}</td>
                <td>
                    <a href="{% url 'edit_user' user.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'delete_user' user.id %}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-primary">Back to Dashboard</a>
</div>

{% endblock %}
