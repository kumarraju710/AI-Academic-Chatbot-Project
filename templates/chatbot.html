{% extends 'base.html' %}
{% block content %}

<style>
/* ===== Layout ===== */
.app {
    display: flex;
    height: 90vh;
    background: #f9fafb;
    color: #111;
}

/* ===== Sidebar ===== */
.sidebar {
    width: 260px;
    background: #1f2937;
    color: white;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.sidebar h3 {
    margin-bottom: 10px;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
}

.chat-history div {
    padding: 8px;
    background: #374151;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 14px;
}

/* ===== Main Chat Area ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ===== Top Bar ===== */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.logout {
    background: #ef4444;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* ===== Chat Box ===== */
.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.msg {
    max-width: 70%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    font-size: 14px;
    /* preserve line breaks from backend text */
    white-space: pre-wrap;
}

.user {
    background: #4f46e5;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e5e7eb;
    color: black;
}

/* ===== Input Area ===== */
.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #e5e7eb;
    background: white;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

.input-area button {
    margin-left: 10px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: #4f46e5;
    color: white;
    font-weight: bold;
}
</style>

<div class="app">
    <!-- hidden form to generate csrf token cookie -->
    <form style="display:none;">{% csrf_token %}</form>

    <!-- ===== LEFT SIDEBAR ===== -->
    <div class="sidebar">
        <h3>💬 Previous Chats</h3>
        <div class="chat-history" id="history">
            <div>Fees</div>
            <div>Deadlines</div>
            <div>Enrollment</div>
        </div>
    </div>

    <!-- ===== MAIN CHAT ===== -->
    <div class="main">

        <!-- Top Bar -->
        <div class="topbar">
            <h2>🤖 Academic Chatbot</h2>
            <a href="{% url 'logout' %}" class="logout">Logout</a>
        </div>

        <!-- Chat Messages -->
        <div class="chat-box" id="chat-box">
            <div class="msg bot">
                Hello! You can ask me about enrollment, fees, deadlines, scholarships, etc.
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input id="user-input" placeholder="Search or ask a question..." onkeypress="enterPressed(event)">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>
</div>

<script>
// utility to read CSRF token from cookie (Django default name)
function getCSRFToken() {
    let name = 'csrftoken';
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let c of cookies) {
            c = c.trim();
            if (c.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(c.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// convert plain text into HTML-safe string with line breaks preserved
function formatMessage(text) {
    if (!text) return '';
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
}

function sendMessage() {
    const input = document.getElementById("user-input");
    const message = input.value.trim();
    if (!message) return;

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<div class="msg user">${formatMessage(message)}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    document.getElementById("history").innerHTML += `<div>${formatMessage(message)}</div>`;

    fetch("{% url 'chatbot_response' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": getCSRFToken(),
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({ message: message })
    })
    .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    })
    .then(data => {
        chatBox.innerHTML += `<div class="msg bot">${formatMessage(data.reply)}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(err => {
        console.error("chatbot fetch error", err);
        chatBox.innerHTML += `<div class="msg bot">⚠️ Server error, please try again.</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    input.value = "";
}

function enterPressed(e) {
    if (e.key === "Enter") sendMessage();
}
</script>

<script>
window.addEventListener("beforeunload", function () {
    navigator.sendBeacon("{% url 'logout' %}");
});
</script>


{% endblock %}
