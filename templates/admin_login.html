{% extends 'base.html' %}
{% block content %}

<div class="card">
    <h2>🛠 Admin Login</h2>

    <p style="color:#ffb4b4;">{{ error }}</p>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn">Login</button>
    </form>
</div>

{% endblock %}
